name: Slim Setup
description: Install the mise-managed Rust toolchain plus a prebuilt nextest, without the full mise tool suite
inputs:
  cache-save:
    description: Whether this job is the designated cache saver (others are restore-only)
    default: "false"
  cache-shared-key:
    description: rust-cache shared-key so jobs share one dependency cache; omit to key by job
    default: ""
runs:
  using: "composite"
  steps:
    - uses: jdx/mise-action@v4
      with:
        install_args: rust
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-shared-key }}
        save-if: ${{ inputs.cache-save == 'true' && github.ref_type != 'tag' }}
