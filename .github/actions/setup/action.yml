name: Shared Setup
description: Install mise, Rust toolchain, and development dependencies
inputs:
  cache-key:
    description: >-
      Stable suffix for the Swatinem/rust-cache shared key. Scope it per release job, and per target triple where one job builds more than one target, so each cache holds a single target/ tree and the combined GitHub Actions cache stays under the ~10 GB repo limit. Empty preserves rust-cache's default per-job key (used by build.yml CI jobs).
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: jdx/mise-action@v4
    # Select sccache's GitHub Actions cache backend (no external S3/R2). These
    # are written before sccache-action runs so it sees SCCACHE_GHA_ENABLED and
    # exports the cache-service tokens; RUSTC_WRAPPER then makes every later
    # cargo build in the job route rustc through sccache.
    - shell: bash
      run: |-
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
    - uses: mozilla/sccache-action@v0.0.10
    - uses: Swatinem/rust-cache@v2
      with:
        # A stable shared key (scoped per job/target via cache-key) keys the
        # cache on the scope instead of the default per-run id, so each release
        # restores the previous release's target/ tree. save-if forces a save on
        # tag builds (rust-cache otherwise only saves on the default branch), so
        # the next release gets a warm restore.
        save-if: "true"
        shared-key: ${{ inputs.cache-key }}
    - if: runner.os == 'Linux'
      shell: bash
      run: |-
        sudo apt-get update -q
        sudo apt-get install -y libgtk-3-dev libxdo-dev
        rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
        rustup component add --toolchain nightly-x86_64-unknown-linux-gnu clippy
