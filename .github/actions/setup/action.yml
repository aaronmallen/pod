name: Shared Setup
description: Install mise, Rust toolchain, and development dependencies
inputs:
  cache-save:
    description: Whether this job is the designated cache saver (others are restore-only)
    default: "false"
  cache-shared-key:
    description: rust-cache shared-key so jobs share one dependency cache; omit to key by job
    default: ""
runs:
  using: "composite"
  steps:
    - uses: jdx/mise-action@v4
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-shared-key }}
        save-if: ${{ inputs.cache-save == 'true' && github.ref_type != 'tag' }}
    - if: runner.os == 'Linux'
      shell: bash
      run: |-
        sudo apt-get update -q
        sudo apt-get install -y libgtk-3-dev libxdo-dev
        rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
        rustup component add --toolchain nightly-x86_64-unknown-linux-gnu clippy
