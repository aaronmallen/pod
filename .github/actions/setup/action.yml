name: Shared Setup
description: Install mise, Rust toolchain, and development dependencies
inputs:
  cache-save:
    description: Whether this job is a designated cache saver (others are restore-only)
    default: "false"
  cache-shared-key:
    description: Namespace so related jobs share one R2 Rust cache; omit for the default namespace
    default: ""
  rust-cache:
    description: Restore the R2 Rust cache; set false for jobs that do not compile
    default: "true"
runs:
  using: "composite"
  steps:
    - uses: jdx/mise-action@v4
    - name: Configure Rust cache
      if: inputs.rust-cache == 'true'
      shell: bash
      run: |-
        echo "POD_RUST_CACHE_SHARED_KEY=${{ inputs.cache-shared-key }}" >> "$GITHUB_ENV"
        # Only main / *-dev / tags may write shared keys, so a bad PR branch (or a
        # fork, which has no secrets) can never poison the cache — restore-only.
        if [[ "${{ inputs.cache-save }}" == "true" \
          && ( "$GITHUB_REF" == "refs/heads/main" \
            || "$GITHUB_REF_NAME" == *-dev \
            || "$GITHUB_REF_TYPE" == "tag" ) ]]; then
          echo "POD_RUST_CACHE_SAVE=1" >> "$GITHUB_ENV"
        fi
    - name: Restore Rust cache (R2)
      if: inputs.rust-cache == 'true'
      shell: bash
      env:
        POD_RUST_CACHE_SHARED_KEY: ${{ inputs.cache-shared-key }}
      run: mise run ci:rust-cache restore
    - if: runner.os == 'Linux'
      shell: bash
      run: |-
        sudo apt-get update -q
        sudo apt-get install -y libgtk-3-dev libxdo-dev
        # GL/EGL/Vulkan loaders (bundled into the AppImage so wgpu can initialize on Wayland) plus the
        # Mesa software-GL/Vulkan drivers (llvmpipe/lavapipe) the host provides at runtime. ADR-0022:
        # ship the loaders, never host-specific GPU drivers/ICDs.
        sudo apt-get install -y \
          libgl1 libglx0 libopengl0 libegl1 libgles2 libglvnd0 libgbm1 libvulkan1 \
          libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers
        rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
        rustup component add --toolchain nightly-x86_64-unknown-linux-gnu clippy
