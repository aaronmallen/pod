name: Build
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches:
      - main
      - "*-dev"
    tags:
      - "[0-9]+.*"
  pull_request:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-save: "true"
      - name: Lint
        run: mise run lint
  check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup
        with:
          cache-shared-key: v0-rust
      - if: runner.os != 'Linux'
        uses: ./.github/actions/setup
        with:
          cache-shared-key: v0-rust
      - name: Check
        if: runner.os == 'Linux'
        run: mise run check
      - name: Check
        if: runner.os != 'Linux'
        run: cargo check --all-targets --all-features
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The Linux job builds a separately-instrumented coverage target via cargo-llvm-cov, which overflows the
      # ~14 GB free on ubuntu-latest. Reclaim the preinstalled toolchains/images we never use before building.
      - if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup
        with:
          cache-shared-key: v0-rust
      - if: runner.os != 'Linux'
        uses: ./.github/actions/setup
        with:
          cache-shared-key: v0-rust
      - name: Test (with coverage)
        if: runner.os == 'Linux'
        run: mise run test
      - name: Test
        if: runner.os != 'Linux'
        run: cargo nextest run --all-features
  conformance:
    # Cross-component telemetry contract conformance (task zvvnoyxu, spec mmmzstpq §6 & §12):
    # the wire shape must not drift across the Rust client, the Cloudflare Worker, and the
    # Settings preview. The Rust conformance module pins all three to the same golden fixtures;
    # the Worker's vitest validates those same fixtures. Either drifting fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-shared-key: v0-rust
      - name: Rust contract conformance
        run: "cargo nextest run --all-features conformance::"
      - name: Worker contract vitest
        working-directory: telemetry
        run: |-
          aube ci
          aube test
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup
        with:
          cache-save: "true"
          cache-shared-key: v0-rust
      - if: runner.os != 'Linux'
        uses: ./.github/actions/setup
        with:
          cache-save: "true"
          cache-shared-key: v0-rust
      - name: Build
        if: runner.os == 'Linux'
        run: mise run build
      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --all-features
