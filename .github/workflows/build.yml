name: Build
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches:
      - main
      - "*-dev"
    tags:
      - "[0-9]+.*"
  pull_request:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-save: "true"
      - name: Lint
        run: mise run lint
  check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup
        with:
          cache-shared-key: v0-rust
      - if: runner.os != 'Linux'
        uses: ./.github/actions/setup
        with:
          cache-shared-key: v0-rust
      - name: Check
        if: runner.os == 'Linux'
        run: mise run check
      - name: Check
        if: runner.os != 'Linux'
        run: cargo check --all-targets --all-features
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The Linux job builds a separately-instrumented coverage target via cargo-llvm-cov, which overflows the
      # ~14 GB free on ubuntu-latest. Reclaim the preinstalled toolchains/images we never use before building.
      - if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup
        with:
          cache-shared-key: v0-rust
      - if: runner.os != 'Linux'
        uses: ./.github/actions/setup
        with:
          cache-shared-key: v0-rust
      - name: Test (with coverage)
        if: runner.os == 'Linux'
        run: mise run test
      - name: Test
        if: runner.os != 'Linux'
        run: cargo nextest run --all-features
  conformance:
    # Cross-component telemetry contract conformance (task zvvnoyxu, spec mmmzstpq §6 & §12):
    # the wire shape must not drift across the Rust client, the Cloudflare Worker, and the
    # Settings preview. The Rust conformance module pins all three to the same golden fixtures;
    # the Worker's vitest validates those same fixtures. Either drifting fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-shared-key: v0-rust
      - name: Rust contract conformance
        run: "cargo nextest run --all-features conformance::"
      - name: Worker contract vitest
        working-directory: web/telemetry
        run: |-
          aube ci
          aube test
  build:
    # actions: write lets the prune step delete stale caches; contents: read covers checkout.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup
        with:
          cache-save: "true"
          cache-shared-key: v0-rust
      - if: runner.os != 'Linux'
        uses: ./.github/actions/setup
        with:
          cache-save: "true"
          cache-shared-key: v0-rust
      - name: Build
        if: runner.os == 'Linux'
        run: mise run build
      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --all-features
      # Swatinem/rust-cache bakes the Cargo.lock hash into each key and NEVER deletes older
      # entries, so lockfile churn thrashes the 10 GB per-repo cap and evicts warm caches.
      # Restore falls back to the NEWEST entry sharing the (shared-key, env, rust/OS) prefix,
      # so every older lockfile-keyed entry is dead weight and safe to delete. Grouping strips
      # the trailing lockfile-hash segment (rust-cache appends it last), which splits STRICTLY
      # per (shared-key, OS) — it never over-merges distinct caches (e.g. the job-keyed `lint`
      # cache) and keeps one newest entry per group. Runs after normal steps but BEFORE the
      # rust-cache post-save, so it never deletes the entry THIS run restored from. Linux leg
      # only (one authority, no cross-matrix delete races), main only.
      # NOTE: validate this grouping against one real `gh cache list --json id,key,createdAt`
      # run before fully trusting the deletes.
      - name: Prune stale rust-cache entries
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          gh cache list --limit 100 --json id,key,createdAt \
            | jq -r '
                group_by(.key | sub("-[^-]*$"; ""))
                | map(sort_by(.createdAt) | reverse | .[1:])
                | flatten
                | .[].id
              ' \
            | xargs -r -n1 gh cache delete || true
