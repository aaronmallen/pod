name: Deploy Pages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: aube --dir apps/marketing install

      - name: Fetch release data
        run: aube --dir apps/marketing run fetch-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse changelog
        run: aube --dir apps/marketing run parse-changelog

      - name: Build site
        run: aube --dir apps/marketing run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/marketing/dist

      - uses: actions/deploy-pages@v5
