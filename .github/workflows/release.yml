name: Release

# Release-candidate (RC) dry-run gating
# -------------------------------------
# A tag containing "-rc." (e.g. 0.5.3-rc.1) is treated as a release candidate:
# the full build + package gauntlet runs and installers are uploaded as
# ephemeral workflow artifacts (rc-macos / rc-windows / rc-linux), but no GitHub
# release is created, no latest.json is generated, and the site is not deployed.
# A bare numeric tag (0.5.3) runs the normal release + deploy path unchanged.
#
# Known limitations:
#   * Detection is the literal "-rc." substring; other pre-release suffixes
#     (-beta.N, -alpha.N) are NOT detected and would be treated as stable.
#   * RC installer filenames carry the numeric Cargo.toml version (e.g. 0.5.3),
#     not the rc number; RC identity lives in the tag + Actions run, not the
#     binary.
#   * latest.json / updater-manifest generation is the only stable-only step an
#     RC does not exercise (it is deliberately suppressed).

permissions:
  actions: write
  contents: write
  id-token: write
  pages: write

on:
  push:
    tags:
      - "[0-9]+.*"

env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

jobs:
  wait-for-build:
    runs-on: ubuntu-latest
    outputs:
      is_rc: ${{ steps.detect-rc.outputs.is_rc }}
    steps:
      - name: Detect release candidate
        id: detect-rc
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" == *-rc.* ]]; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Build workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.sha }}"
          echo "Waiting for Build workflow to complete on $sha..."
          while true; do
            result=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/build.yml/runs" \
              --jq ".workflow_runs[] \
                | select(.head_sha == \"$sha\") \
                | .conclusion" \
              | head -1)
            case "$result" in
              success) echo "Build passed"; exit 0 ;;
              failure|cancelled|timed_out) echo "Build $result"; exit 1 ;;
              *) echo "Build still running..."; sleep 30 ;;
            esac
          done

  create-release:
    needs: wait-for-build
    if: ${{ needs.wait-for-build.outputs.is_rc == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          draft: true
          title: v$tag
          token: ${{ secrets.GITHUB_TOKEN }}

  generate-icons:
    needs: wait-for-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          rust-cache: "false"

      - name: Generate item icons
        run: mise run generate:item-images-cache

      - name: Upload item icons
        uses: actions/upload-artifact@v7
        with:
          name: item-images
          path: assets/images/items

  package-macos:
    needs:
      - wait-for-build
      - create-release
      - generate-icons
    if: ${{ always() && needs.generate-icons.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: macos-latest
    env:
      PACKAGER_PUBLIC_KEY: ${{ secrets.PACKAGER_PUBLIC_KEY }}
      PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY }}
      POD_TELEMETRY_URL: https://pod.aaronmallen.dev/telemetry/v1/ingest
      POD_TELEMETRY_KEY: ${{ secrets.POD_TELEMETRY_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cache-save: "true"
          cache-shared-key: v0-pkg

      - name: Download item icons
        uses: actions/download-artifact@v8
        with:
          name: item-images
          path: assets/images/items

      - name: Add Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Import Apple certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" build.keychain
          rm certificate.p12

      - name: Build and package (x86_64)
        run: mise run package --format dmg --target x86_64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Notarize macOS app (x86_64)
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(find . -path "*/x86_64-apple-darwin/*" -name "*.dmg" | head -1)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Create app tarball for updater (x86_64)
        run: |
          hdiutil detach /Volumes/PodUpdateMount || true
          DMG=$(find . -path "*/x86_64-apple-darwin/*" -name "*.dmg" | head -1)
          TARBALL="${DMG%.dmg}.app.tar.gz"
          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/PodUpdateMount
          APP=$(find /Volumes/PodUpdateMount -maxdepth 1 -name "*.app" | head -1)
          xcrun stapler staple "$APP" || true
          tar -czf "$TARBALL" -C /Volumes/PodUpdateMount "$(basename "$APP")"
          hdiutil detach /Volumes/PodUpdateMount

      - name: Sign package for updater (x86_64)
        if: env.PACKAGER_SIGN_PRIVATE_KEY != ''
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          TARBALL=$(find . -path "*/x86_64-apple-darwin/*" -name "*.app.tar.gz" | head -1)
          cargo-packager signer sign "$TARBALL"

      - name: Build and package (aarch64)
        run: mise run package --format dmg --target aarch64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Notarize macOS app (aarch64)
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(find . -path "*/aarch64-apple-darwin/*" -name "*.dmg" | head -1)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Create app tarball for updater (aarch64)
        run: |
          DMG=$(find . -path "*/aarch64-apple-darwin/*" -name "*.dmg" | head -1)
          TARBALL="${DMG%.dmg}.app.tar.gz"
          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/PodUpdateMount
          APP=$(find /Volumes/PodUpdateMount -maxdepth 1 -name "*.app" | head -1)
          xcrun stapler staple "$APP" || true
          tar -czf "$TARBALL" -C /Volumes/PodUpdateMount "$(basename "$APP")"
          hdiutil detach /Volumes/PodUpdateMount

      - name: Sign package for updater (aarch64)
        if: env.PACKAGER_SIGN_PRIVATE_KEY != ''
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          TARBALL=$(find . -path "*/aarch64-apple-darwin/*" -name "*.app.tar.gz" | head -1)
          cargo-packager signer sign "$TARBALL"

      - name: Upload to release
        if: ${{ needs.wait-for-build.outputs.is_rc == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          find . \( -name "*.dmg" -o -name "*.app.tar.gz" \
            -o -name "*.app.tar.gz.sig" \) -print0 \
            | while IFS= read -r -d '' f; do
            gh release upload "$REF_NAME" "$f"
          done

      - name: Upload installers as artifacts (RC)
        if: ${{ needs.wait-for-build.outputs.is_rc == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: rc-macos
          if-no-files-found: error
          path: |
            **/*.dmg
            **/*.app.tar.gz
            **/*.app.tar.gz.sig

      - name: Save Rust cache (R2)
        if: ${{ always() && env.POD_RUST_CACHE_SAVE == '1' }}
        shell: bash
        run: mise run ci:rust-cache save

  package-windows:
    needs:
      - wait-for-build
      - create-release
      - generate-icons
    if: ${{ always() && needs.generate-icons.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: windows-latest
    env:
      PACKAGER_PUBLIC_KEY: ${{ secrets.PACKAGER_PUBLIC_KEY }}
      PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY }}
      POD_TELEMETRY_URL: https://pod.aaronmallen.dev/telemetry/v1/ingest
      POD_TELEMETRY_KEY: ${{ secrets.POD_TELEMETRY_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cache-save: "true"
          cache-shared-key: v0-pkg

      - name: Download item icons
        uses: actions/download-artifact@v8
        with:
          name: item-images
          path: assets/images/items

      - name: Add Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install WiX Toolset v3
        run: choco upgrade wixtoolset -y

      - name: Build and package (nsis + wix)
        run: mise run package --format nsis,wix

      - name: Sign Windows installers
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $cert = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("certificate.pfx", $cert)
          Get-ChildItem -Recurse -Include "*-setup.exe","*.msi" | ForEach-Object {
            & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" `
              sign /f certificate.pfx `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /tr http://timestamp.sectigo.com /td sha256 /fd sha256 `
              $_.FullName
          }
          Remove-Item certificate.pfx

      - name: Sign package for updater
        if: env.PACKAGER_SIGN_PRIVATE_KEY != ''
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          if ($nsis) { cargo-packager signer sign $nsis.FullName }

      - name: Upload to release
        if: ${{ needs.wait-for-build.outputs.is_rc == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include "*-setup.exe","*.msi","*.exe.sig" | ForEach-Object {
            gh release upload "${{ github.ref_name }}" $_.FullName
          }

      - name: Upload installers as artifacts (RC)
        if: ${{ needs.wait-for-build.outputs.is_rc == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: rc-windows
          if-no-files-found: error
          path: |
            **/*-setup.exe
            **/*.msi
            **/*.exe.sig

      - name: Save Rust cache (R2)
        if: ${{ always() && env.POD_RUST_CACHE_SAVE == '1' }}
        shell: bash
        run: mise run ci:rust-cache save

  package-linux:
    needs:
      - wait-for-build
      - create-release
      - generate-icons
    if: ${{ always() && needs.generate-icons.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      PACKAGER_PUBLIC_KEY: ${{ secrets.PACKAGER_PUBLIC_KEY }}
      PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY }}
      POD_TELEMETRY_URL: https://pod.aaronmallen.dev/telemetry/v1/ingest
      POD_TELEMETRY_KEY: ${{ secrets.POD_TELEMETRY_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cache-save: "true"
          cache-shared-key: v0-pkg

      - name: Download item icons
        uses: actions/download-artifact@v8
        with:
          name: item-images
          path: assets/images/items

      - name: Add Rust target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Build and package (deb + appimage + pacman)
        run: mise run package --format deb,appimage,pacman

      - name: Sign package for updater
        if: env.PACKAGER_SIGN_PRIVATE_KEY != ''
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          APPIMAGE=$(find . -name "*.AppImage" | head -1)
          cargo-packager signer sign "$APPIMAGE"

      - name: Build pacman package
        run: |
          mkdir -p /tmp/pkgbuild
          cp target/release/PKGBUILD /tmp/pkgbuild/
          find target/release -name "*.tar.gz" -exec cp {} /tmp/pkgbuild/ \;
          sed -i '/^pkgver=/s/-/_/g' /tmp/pkgbuild/PKGBUILD
          docker run --rm -v "/tmp/pkgbuild:/pkg" archlinux:latest bash -c \
            "pacman -Sy --noconfirm base-devel && \
            useradd -m builder && \
            chown -R builder:builder /pkg && \
            su builder -c 'cd /pkg && makepkg --noconfirm'"
          find /tmp/pkgbuild -name "*.pkg.tar.zst" \
            -exec cp {} target/release/ \;

      - name: Upload to release
        if: ${{ needs.wait-for-build.outputs.is_rc == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          find . \( -name "*.deb" -o -name "*.AppImage" \
            -o -name "*.AppImage.sig" -o -name "*.pkg.tar.zst" \) -print0 \
            | while IFS= read -r -d '' f; do
            gh release upload "$REF_NAME" "$f"
          done

      - name: Install Flatpak tools
        run: sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtime
        run: sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Prepare binary tarball
        run: |
          deb=$(find . -name "*.deb" | head -1)
          mkdir -p deb-extract
          dpkg-deb -x "$deb" deb-extract
          binary=$(find deb-extract -name "pod" -type f | head -1)
          [[ -n "$binary" ]] || { echo "::error::pod binary not found in .deb"; exit 1; }
          mkdir -p tarball-root/usr/bin
          cp "$binary" tarball-root/usr/bin/pod
          tarball="pod-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czf "$tarball" -C tarball-root .
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Generate Flatpak files
        run: mise run generate:flatpak --path "../$TARBALL"

      - name: Build Flatpak
        run: sudo flatpak-builder --repo=repo build-dir flatpak/dev.aaronmallen.pod.yml

      - name: Bundle Flatpak
        run: flatpak build-bundle repo dev.aaronmallen.pod.flatpak dev.aaronmallen.pod

      - name: Upload Flatpak to release
        if: ${{ needs.wait-for-build.outputs.is_rc == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "$TARBALL" --clobber
          gh release upload "${{ github.ref_name }}" dev.aaronmallen.pod.flatpak --clobber

      - name: Upload installers as artifacts (RC)
        if: ${{ needs.wait-for-build.outputs.is_rc == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: rc-linux
          if-no-files-found: error
          path: |
            target/release/*.deb
            target/release/*.AppImage
            target/release/*.AppImage.sig
            target/release/*.pkg.tar.zst
            ${{ env.TARBALL }}
            dev.aaronmallen.pod.flatpak

      - name: Save Rust cache (R2)
        if: ${{ always() && env.POD_RUST_CACHE_SAVE == '1' }}
        shell: bash
        run: mise run ci:rust-cache save

  publish-release:
    needs:
      - wait-for-build
      - package-macos
      - package-windows
      - package-linux
    if: >-
      ${{ needs.wait-for-build.outputs.is_rc == 'false'
        && needs.package-macos.result == 'success'
        && needs.package-windows.result == 'success'
        && needs.package-linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p sigs
          gh release download "$TAG" --pattern "*.sig" --dir sigs/ || true

          python3 - << 'PYEOF'
          import json, os, subprocess
          from pathlib import Path

          tag = os.environ['GITHUB_REF_NAME']

          result = subprocess.run(
              ['gh', 'release', 'view', tag, '--json', 'assets'],
              capture_output=True, text=True, check=True,
          )
          repo = os.environ.get('GITHUB_REPOSITORY', 'aaronmallen/pod')
          base_url = f'https://github.com/{repo}/releases/download/{tag}'
          assets = {
              a['name']: f'{base_url}/{a["name"]}'
              for a in json.loads(result.stdout)['assets']
          }

          def find_url(predicate):
              return next((url for name, url in assets.items() if predicate(name)), None)

          def read_sig(predicate):
              sig_dir = Path('sigs')
              if not sig_dir.exists():
                  return None
              for path in sig_dir.iterdir():
                  if predicate(path.name):
                      return path.read_text().strip()
              return None

          platforms = {}

          url = find_url(lambda n: 'aarch64' in n and n.endswith('.app.tar.gz'))
          sig = read_sig(lambda n: 'aarch64' in n and n.endswith('.app.tar.gz.sig'))
          if url:
              platforms['macos-aarch64'] = {'url': url, 'signature': sig or '', 'format': 'app'}

          url = find_url(lambda n: ('x64' in n or 'x86_64' in n) and n.endswith('.app.tar.gz'))
          sig = read_sig(lambda n: ('x64' in n or 'x86_64' in n) and n.endswith('.app.tar.gz.sig'))
          if url:
              platforms['macos-x86_64'] = {'url': url, 'signature': sig or '', 'format': 'app'}

          url = find_url(lambda n: n.endswith('.AppImage'))
          sig = read_sig(lambda n: n.endswith('.AppImage.sig'))
          if url:
              platforms['linux-x86_64'] = {'url': url, 'signature': sig or '', 'format': 'appimage'}

          url = find_url(lambda n: n.endswith('-setup.exe'))
          sig = read_sig(lambda n: n.endswith('-setup.exe.sig'))
          if url:
              platforms['windows-x86_64'] = {'url': url, 'signature': sig or '', 'format': 'nsis'}

          if not platforms:
              print('No platform assets found; skipping manifest generation')
          else:
              pub_date = subprocess.run(
                  ['date', '-u', '+%Y-%m-%dT%H:%M:%SZ'],
                  capture_output=True, text=True,
              ).stdout.strip()
              manifest = {
                  'version': tag,
                  'notes': 'See the release page for details.',
                  'pub_date': pub_date,
                  'platforms': platforms,
              }
              with open('latest.json', 'w') as f:
                  json.dump(manifest, f, indent=2)
              print(f"Generated latest.json with platforms: {list(platforms.keys())}")
          PYEOF

          if [ -f latest.json ]; then
            gh release upload "$TAG" latest.json --clobber
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false

      - name: Announce release on Discord
        if: env.DISCORD_RELEASE_WEBHOOK_URL != ''
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          release=$(gh release view "$TAG" --json body,name,url)
          title=$(jq -r '.name' <<< "$release")
          url=$(jq -r '.url' <<< "$release")
          body=$(jq -r '.body' <<< "$release")

          more=$'\n\n[→ full changelog]('"$url"$')'
          limit=4096
          if [ "${#body}" -gt "$limit" ]; then
            body="${body:0:$((limit - ${#more}))}$more"
          fi

          payload=$(jq -n \
            --arg title "$title Released" \
            --arg description "$body" \
            --arg url "$url" \
            '{embeds: [{title: $title, description: $description, url: $url, color: 4176091}]}')

          curl -fsSL -X POST -H "Content-Type: application/json" \
            -d "$payload" "$DISCORD_RELEASE_WEBHOOK_URL"

  deploy-pages:
    needs:
      - wait-for-build
      - publish-release
    if: ${{ needs.wait-for-build.outputs.is_rc == 'false' }}
    uses: ./.github/workflows/deploy-pages.yml
    secrets: inherit
