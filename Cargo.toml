[package]
authors = ["Aaron Allen <hello@aaronmallen.me>"]
description = "A one-stop-shop capsuleer manager for EVE Online."
edition = "2024"
homepage = "https://pod.aaronmallen.dev"
include = ["assets/*", "migrations/*", "src/*", "LICENSE", "README.md"]
license = "MIT"
name = "pod"
publish = false
repository = "https://www.github.com/aaronmallen/pod"
version = "0.5.4"

[package.metadata.packager]
category = "Utility"
icons = [
  "assets/images/identity/32x32.png",
  "assets/images/identity/128x128.png",
  "assets/images/identity/256x256.png",
  "assets/images/identity/icon.icns",
  "assets/images/identity/icon.ico",
]
identifier = "dev.aaronmallen.pod"
product-name = "Pod"
resources = ["assets"]

[[package.metadata.packager.deep-link-protocols]]
schemes = ["eveauth-pod"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-services = { features = ["AE"], version = "0.3" }
objc2-foundation = { features = [
  "NSAppleEventDescriptor",
  "NSAppleEventManager",
  "NSString",
  "objc2-core-services",
], version = "0.3" }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[dependencies]
base64 = "0.22"
cargo-packager-updater = "0.2.3"
chrono = "0.4"
dir_spec = "0.5.2"
figment = { features = ["toml"], version = "0.10.19" }
getset = "0.1"
interprocess = "2.4.2"
libc = "0.2"
muda = "0.19"
open = "5"
rand = "0.10"
reqwest = { features = ["form", "gzip", "json"], version = "0.13" }
rfd = "0.17"
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { features = ["full"], version = "1" }
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { features = ["env-filter", "json"], version = "0.3.23" }
zip = { default-features = false, features = ["deflate"], version = "8" }

[dependencies.iced]
features = ["advanced", "canvas", "image", "svg", "tokio"]
version = "0.14"

[dependencies.sqlx]
features = ["migrate", "runtime-tokio", "sqlite", "sqlite-bundled"]
version = "0.9"

[dev-dependencies]
pretty_assertions = "1"
wiremock = "0.6"
