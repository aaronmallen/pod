[package]
authors.workspace = true
description = "A one-stop-shop capsuleer manager for EVE Online."
edition.workspace = true
homepage.workspace = true
include = ["assets/*", "migrations/*", "src/*", "LICENSE", "README.md"]
license.workspace = true
name = "pod"
publish = false
repository.workspace = true
version = "0.7.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-core-services.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win.workspace = true
winreg.workspace = true

[package.metadata.packager]
category = "Utility"
icons = [
  "assets/images/identity/32x32.png",
  "assets/images/identity/128x128.png",
  "assets/images/identity/256x256.png",
  "assets/images/identity/icon.icns",
  "assets/images/identity/icon.ico",
]
identifier = "dev.aaronmallen.pod"
product-name = "Pod"
resources = ["assets"]

[package.metadata.packager.appimage]
libs = [
  "libEGL.so.1",
  "libGL.so.1",
  "libGLESv2.so.2",
  "libGLX.so.0",
  "libGLdispatch.so.0",
  "libOpenGL.so.0",
  "libgbm.so.1",
  "libvulkan.so.1",
]

[[package.metadata.packager.deep-link-protocols]]
schemes = ["eveauth-pod"]

[[package.metadata.packager.file-associations]]
description = "Pod Budget Rules Pack"
extensions = ["pbr"]
mime-type = "application/x-pod-budget-rules"
name = "Budget Rules Pack"
role = "editor"

[[package.metadata.packager.file-associations]]
description = "Pod Facility Intel Pack"
extensions = ["pfi"]
mime-type = "application/x-pod-facility-intel"
name = "Facility Intel Pack"
role = "editor"

[[package.metadata.packager.file-associations]]
description = "Pod Skill Plan Pack"
extensions = ["psp"]
mime-type = "application/x-pod-skill-plan"
name = "Skill Plan Pack"
role = "editor"

[dependencies]
base64.workspace = true
cargo-packager-updater.workspace = true
chrono.workspace = true
crc32fast.workspace = true
dir_spec.workspace = true
figment.workspace = true
flate2.workspace = true
futures-util.workspace = true
gethostname.workspace = true
getset.workspace = true
iced.workspace = true
interprocess.workspace = true
libc.workspace = true
open.workspace = true
rand.workspace = true
reqwest.workspace = true
rfd.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
sqlx.workspace = true
sys-locale.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
zip.workspace = true

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
iced_runtime.workspace = true
pretty_assertions.workspace = true
tokio = { features = ["test-util"], workspace = true }
wiremock.workspace = true

[lints.rust]
dead_code = "deny"
