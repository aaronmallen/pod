trademark_notice = "EVE Online과 EVE 로고는 Fenris Creations(이전 CCP hf.)의 등록 상표입니다. 전 세계적으로 모든 권리가 보유됩니다. 그 밖의 모든 상표는 각 소유자의 자산입니다. EVE Online, EVE 로고, EVE 및 관련된 모든 로고와 디자인은 Fenris Creations의 지적 재산입니다. 이러한 상표와 관련된 지적 재산의 모든 아트워크, 스크린샷, 캐릭터, 차량, 스토리라인, 세계관 설정 또는 그 밖의 식별 가능한 요소 역시 Fenris Creations의 지적 재산입니다. Fenris Creations는 Pod에 EVE Online 및 관련된 모든 로고와 디자인을 홍보 및 정보 제공 목적으로 사용하도록 허가했으나, Pod를 보증하지 않으며 어떠한 방식으로도 Pod와 제휴하지 않습니다. Fenris Creations는 이 프로그램의 콘텐츠나 작동에 대해 어떠한 책임도 지지 않으며, 이 프로그램의 사용으로 발생하는 어떠한 손해에 대해서도 책임지지 않습니다."
