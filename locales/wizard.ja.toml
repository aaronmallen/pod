[wizard.features]
disable_all = "すべて無効化"
enable_all = "すべて有効化"
eyebrow = "機能 · %{total} 件中 %{current}"
on_count = "%{total} 件中 %{on} がオン"

[wizard.finish]
eyebrow = "完了"
features_groups = "%{count} グループにわたって"
features_label = "有効な機能"
language_label = "言語"
lede = "Pod の設定が完了し、準備が整いました。選択内容はこのマシンの設定に保存されています。アプリを開いて飛行を始めるか、戻って調整してください。"
privacy_note = "ここにあるすべての項目はアプリの「設定」内にあります。機能、パス、アクセシビリティなどはいつでも変更できます。"
storage_customized = "カスタマイズ済み"
storage_default = "デフォルト"
storage_label = "ストレージのパス"
title = "準備完了です"

[wizard.language]
card_label = "%{label}"
eyebrow = "言語"
lede = "Pod はこの言語でアイテム名、説明、その他のローカライズされたテキストを EVE の ESI から要求します。これらは ESI 自身が対応している言語です。設定からいつでも切り替えられます。"
note = "Pod 自体のインターフェースは現在のところ英語です。この設定は ESI が返すローカライズされたゲームデータを制御します（Accept-Language: %{code} として送信されます）。"
title = "言語を選択"

[wizard.footer]
back = "戻る"
continue_to_features = "機能へ進む"
continue_to_storage = "ストレージへ進む"
get_started = "始める"
next = "続ける"
open = "Pod を開く"
review = "確認して完了"
skip = "セットアップをスキップ"

[wizard.phase.features]
label = "機能"
sub = "%{count} グループ"

[wizard.phase.finish]
label = "完了"
sub = "Pod を起動"

[wizard.phase.language]
label = "言語"
sub = "ESI のレスポンス"

[wizard.phase.storage]
label = "ストレージ"
sub = "データの保存先"

[wizard.phase.welcome]
label = "ようこそ"
sub = "始める"

[wizard.rail]
eyebrow = "Pod · 初回起動"
features_count = "%{on}/%{total}"
progress = "進捗"
step_counter = "%{current} / %{total}"
title = "セットアップ"

[wizard.status]
session = "初回起動セットアップ"
step = "ステップ"
step_counter = "%{current}/%{total}"

[wizard.storage]
all_defaults = "すべてデフォルト"
customized_count = "%{total} 件中 %{count} 件をカスタマイズ"
eyebrow = "ストレージ"
lede = "パスはデフォルトでプラットフォームの慣例に従います。別のボリュームに Pod のデータを置いたり、複数のインストール間で共有したりするには変更してください。これらは後で設定からいつでも調整できます。"
title = "Pod のファイルの保存先"

[wizard.welcome]
eyebrow = "POD へようこそ"
lede = "飛行を始める前に Pod を仕立てるための 2 分間のウォークスルーです。どの機能を動かすか、Pod がファイルをどこに保存するかを選びます。そのあとはすぐにアプリへ進みます。"
point_features_desc = "機能グループ全体にわたって Pod の機能のオンとオフを切り替えます。すべてオンの状態で始まるので、不要なものを削っていきましょう。"
point_features_title = "機能を選ぶ"
point_privacy_desc = "セットアップはローカルの設定にのみ書き込みます。これらはすべて後で設定から変更できます。"
point_privacy_title = "何もマシンの外に出ません"
point_storage_desc = "Pod のデータベース、ログ、キャッシュをデフォルトのボリュームに置くか、共有された場所を指定します。"
point_storage_title = "データの保存先を選ぶ"
title = "セットアップを始めましょう"

[wizard.window]
title = "Pod — 初回セットアップ"
